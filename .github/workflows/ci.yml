name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      BL_IOS_UPSTREAM_SCRIPT: ${{ runner.temp }}/Bruteforce.sh
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python: "3.9"
          - os: macos-14
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.13"
          - os: windows-2022
            python: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked runtime and package
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps .
          python -m pip check
          python check_dependencies.py
      - name: Install desktop test libraries
        if: matrix.python == '3.13'
        run: python -m pip install -r requirements-build.txt
      - name: Install Linux display services for GUI tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Test recovery, USB and SSH transport
        env:
          BL_IOS_UPSTREAM_SCRIPT: ${{ runner.temp }}/Bruteforce.sh
        run: |
          python -c "import hashlib, os, pathlib, urllib.request; from ios_timeout.upstream import REVISION, SCRIPT_SHA256; data=urllib.request.urlopen('https://raw.githubusercontent.com/tuanemss/32bit-Bruteforce-Passcode/'+REVISION+'/Bruteforce.sh', timeout=30).read(); assert hashlib.sha256(data).hexdigest()==SCRIPT_SHA256; pathlib.Path(os.environ['BL_IOS_UPSTREAM_SCRIPT']).write_bytes(data)"
          python -m unittest discover -s tests -v
      - name: Check launcher and installed CLI
        shell: bash
        run: |
          bash -n Launch.command
          bash -n Launch.sh
          bruteforce-legacy-ios --version
          bruteforce-legacy-ios reset --help
          bruteforce-legacy-ios bruteforce --help
      - name: Build verified source archive
        run: python build_release.py
      - name: Exercise desktop without dependency installation
        if: matrix.python == '3.13'
        run: python desktop.py --self-test
      - name: Install Windows cross-compiler for desktop packaging
        if: runner.os == 'macOS' && matrix.python == '3.13'
        run: brew list mingw-w64 || brew install mingw-w64
      - name: Assemble all desktop platforms
        if: runner.os == 'macOS' && matrix.python == '3.13'
        run: python build_desktop.py --all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'macOS' && matrix.python == '3.13'
        with:
          name: desktop-downloads
          path: dist/
          retention-days: 14
