name: Build bundled Python 2 runtime
on:
  workflow_dispatch:
  push:
    branches: [codex/bundled-python2]
    paths:
      - third_party/python2-runtime/build_linux.py
      - .github/workflows/python2-runtime.yml
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install build libraries
        run: sudo apt-get update && sudo apt-get install -y libffi-dev zlib1g-dev libbz2-dev patchelf
      - name: Build and test relocated runtime
        run: python third_party/python2-runtime/build_linux.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python2-linux-runtime
          path: |
            build/python2-runtime/*.zip
            build/python2-runtime/*.json
          retention-days: 7
