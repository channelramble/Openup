[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iphone-timeout-reset"
version = "1.0.0"
description = "Backed-up, one-time lockout-state reset for legacy 32-bit iPhones"
requires-python = ">=3.9"
dependencies = ["paramiko==5.1.0"]

[project.scripts]
iphone-timeout-reset = "ios_timeout.cli:main"

[tool.setuptools.packages.find]
include = ["ios_timeout*"]
