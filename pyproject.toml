[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bruteforce-legacy-ios"
dynamic = ["version"]
description = "Legacy iPhone timer reset and integrated passcode-recovery ramdisk tools"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["paramiko==5.1.0"]

[project.scripts]
bruteforce-legacy-ios = "ios_timeout.cli:main"
iphone-timeout-reset = "ios_timeout.cli:main"

[project.optional-dependencies]
desktop = ["PySide6-Essentials==6.9.3; sys_platform == 'darwin'",
           "shiboken6==6.9.3; sys_platform == 'darwin'",
           "PySide6-Essentials==6.12.0; sys_platform != 'darwin'",
           "shiboken6==6.12.0; sys_platform != 'darwin'", "certifi==2026.10.19",
           "pywinpty==3.1.0; sys_platform == 'win32'"]

[project.urls]
Repository = "https://github.com/channelramble/Bruteforce-Legacy-iOS"
Issues = "https://github.com/channelramble/Bruteforce-Legacy-iOS/issues"

[tool.setuptools.dynamic]
version = {attr = "ios_timeout.__version__"}

[tool.setuptools.packages.find]
include = ["ios_timeout*"]

[tool.setuptools.package-data]
ios_timeout = ["*.txt", "*.svg", "data/*"]
